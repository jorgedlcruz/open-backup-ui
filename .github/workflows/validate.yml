name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CAPACITY_COLLECTOR_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Regression tests
        run: npm test
      - name: Production build, lint, and type checks
        run: npm run build
