# Open Backup UI v1.2.0
name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CAPACITY_COLLECTOR_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check dependency tree
        run: npm ls --all
      - name: Regression tests
        run: npm test
      - name: Verify file versions
        run: npm run version:files -- --check
      - name: Production build, lint, and type checks
        run: npm run build
